# Site + pipeline configuration
site_title: "Oxford journal article processing charge (APC) finder"
site_tagline: "Which journals do Oxford's open-access deals cover, and what will publishing cost?"
# GitHub repository that hosts this site (used for error-report links).
github_repo: "ben18785/oxford-apc-finder"
# University of Oxford ROR ID (https://ror.org/052gg0110)
institution_ror: "052gg0110"
institution_name: "University of Oxford"

# Data sources (documented; scripts read these)
sources:
  jct_ta_index_csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vStezELi7qnKcyE8OiO2OYx2kqQDOnNsDX1JfAsK487n2uB_Dve5iDTwhUFfJ7eFPDhEjkfhXhqVTGw/pub?gid=1130349201&single=true&output=csv"
  jct_ta_docs: "https://journalcheckertool.org/transformative-agreements/"
  jct_api: "https://api.journalcheckertool.org"
  bodleian_deals: "https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/journal-article/publisher-deals"
  bodleian_apc: "https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/apc"
  bodleian_block_grants: "https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/block-grants"
  openalex_api: "https://api.openalex.org"
  doaj_api: "https://doaj.org/api"
  doaj_journal_csv: "https://doaj.org/csv"
  doaj_withdrawn_sheet_csv: "https://docs.google.com/spreadsheets/d/1Kv3MbgFSgtSDnEGkA2JacrSjunRu0umHeZCtcMeqO5E/gviz/tq?tqx=out:csv&sheet=Withdrawn"
  # Human-readable view of the same sheet. The withdrawal changelog is
  # CC BY-SA 4.0 (unlike DOAJ's CC0 journal metadata), so wherever the site
  # shows a withdrawal reason it credits this and names the licence.
  doaj_withdrawn_changelog: "https://docs.google.com/spreadsheets/d/1Kv3MbgFSgtSDnEGkA2JacrSjunRu0umHeZCtcMeqO5E/"

# Optional OpenAlex API key (free at https://openalex.org/settings/api).
# Set as env var OPENALEX_API_KEY in CI; raises the free daily credit to $1/day.
# Validation thresholds
# What gets into the dataset at all.
inclusion:
  # The most-cited journals worldwide are always included, whoever publishes
  # them. This is the backstop for the hand-written publisher allowlist, which
  # will always be missing someone — it once omitted the Institute of
  # Mathematical Statistics, and with it all four Annals titles.
  # 15,000 is chosen empirically, not by feel: The Annals of Applied Statistics
  # (66,491 citations) ranks about 5,650th, so a top-5,000 cut would have missed
  # one of the four journals that exposed this gap. 15,000 reaches journals with
  # roughly 15,000 citations and gives ~3x headroom. Costs 75 requests (~$0.008).
  top_journals_by_citations: 15000
  # Journals the site has listed before stay in scope for this long, even if no
  # other rule still selects them. Makes coverage monotonic against a source
  # having a bad day, while bounding the accumulation of genuinely dead titles.
  # Leading journals within each of OpenAlex's 252 subfields. A global citation
  # ranking is dominated by biomedicine and physics, so small disciplines only
  # reach it with their very largest titles. Ranking inside each subfield gives
  # every field its own head of the distribution — which is what makes the
  # humanities and social sciences findable at all.
  # Set to 0 to skip. Enabled only after a refresh has been seen to succeed
  # with it: it adds ~500 requests and ~13 minutes, and an untested fetch path
  # inside an hour-long job can leave a known-bad dataset live if it fails.
  top_journals_per_subfield: 250
  # The sweep costs ~500 requests and ~13 minutes, and it is a DISCOVERY step:
  # it answers "which journals lead each discipline", and that does not change
  # from one Monday to the next. Once discovered, a journal stays in scope via
  # known_journals.tsv for remember_journals_days below, and its facts are
  # re-fetched every run like everything else — so a quarterly sweep costs
  # nothing in freshness. Keep this comfortably under remember_journals_days or
  # journals will age out of scope between sweeps.
  # Run it now with: APC_FORCE_SUBFIELD_SWEEP=1, or the workflow input.
  subfield_sweep_days: 90
  remember_journals_days: 365

# Usage monitoring.
#
# GoatCounter is used because it fits the same constraints as the rest of the
# site: no cookies, no IP addresses retained (it hashes IP+user-agent with a
# salt that rotates daily to count uniques, then discards it), no cross-site
# identifiers, and no consent banner needed under GDPR. It is also open source,
# so if the hosted service goes away the same data can be self-hosted.
#
# Leave goatcounter_code null and NO beacon is loaded at all: no third-party
# script, no requests, and the usage view does not appear. The site is
# functionally identical either way, which is the point — monitoring must never
# be load-bearing.
analytics:
  # Your GoatCounter site code, i.e. the <code>.goatcounter.com subdomain.
  goatcounter_code: ben18785
  # A journal joins the public "most looked up" chart only once it has at least
  # this many views. Oxford is a small population and a journal lookup is close
  # to a statement of intent to submit; at low counts, publishing it edges from
  # a fact about the journal towards a fact about a person.
  min_views_to_publish: 5
  # Likewise for the zero-result search list, which is free text and so needs a
  # higher bar before anything is shown publicly.
  min_searches_to_publish: 3
  # How far back the published figures reach.
  window_days: 90

validation:
  max_weekly_drop_pct: 10        # fail build if deal-journal count drops more than this
  oracle_sample_size: 25         # random journals cross-checked against live JCT API
  # Over-claims (we say covered, JCT says not) always fail: nobody should be
  # told publishing is free when it is not. Under-claims are tolerated in small
  # numbers because a renamed journal reliably produces one — OpenAlex keeps the
  # former title as its own source while the agreement lists only the current
  # one — and no one is billed by surprise. Several at once means the agreement
  # data is genuinely not being read properly.
  max_oracle_under_claims: 2
  max_dataset_age_days: 10       # site warns readers past this age (weekly refresh + slack)
  # Floors per source. A partially-fetched source can hide inside a
  # whole-dataset percentage threshold; these catch it directly. Set well below
  # observed values (Aug 2026: 42 agreements, 43.8k OpenAlex, 23.1k DOAJ,
  # 2.1k withdrawals) so normal fluctuation never trips them.
  min_source_counts:
    agreements: 30
    openalex: 30000
    doaj_journals: 18000
    withdrawn: 1000
