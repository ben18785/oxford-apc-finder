# Inclusion rule 3: journals from these publishers are included in the dataset
# even when they have no Oxford deal and are not in DOAJ (this is what admits
# reputable hybrid journals). Seeded from publishers participating in
# Jisc/ESAC-registered agreements plus major society/university presses.
# Matching is a case-insensitive regex against OpenAlex host_organization_name
# (and its lineage names).
#
# NOTE: this list gates INCLUSION only. It is never displayed as an
# endorsement, and journals withdrawn from DOAJ for misconduct-type reasons
# are excluded regardless of publisher (see merge.py).

