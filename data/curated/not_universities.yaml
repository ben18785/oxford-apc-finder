# Organisations the ROR registry types as "education" that are not universities.
#
# The list of other institutions (data/out/institutions.json) is limited to
# universities, and ROR's "education" type is the only machine-readable test
# for that. It also takes in further-education colleges, which join the
# occasional Jisc agreement. ROR cannot tell the two apart, so the colleges
# seen so far are listed here and left out.
#
# Leaving one in by mistake costs a line of clutter in a list. Leaving a real
# university out means its researchers cannot pick it. So when unsure, do NOT
# add it here — specialist institutions with their own degrees (conservatoires,
# art schools, medical and business schools) are deliberately kept.
#
# Taken from the participants of the Jisc agreements on 2026-10-13.
