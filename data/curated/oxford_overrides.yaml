# Hand-curated overlay: Oxford-specific deal facts NOT carried by the JCT
# transformative-agreement data. Curated from the Bodleian publisher-deals page:
#   https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/journal-article/publisher-deals
# (retrieved 2026-08-06). watch_bodleian.py diffs that page weekly and opens a
# needs-review issue when it changes, so edits to this file happen in a PR with
# the page diff as evidence.
#
# Entry kinds:
#   caveat      — annotate a JCT-covered agreement (matched by esac_id prefix)
#   discount    — % off list APC for Oxford authors (matched by publisher regex
#                 against OpenAlex host_organization_name, or explicit ISSNs)
#   diamond     — free-to-publish arrangements Oxford supports
#   green       — no-fee self-archiving arrangement worth surfacing
#   note        — informational only
#
# `source` defaults to the Bodleian deals page; override per entry if a more
# specific URL exists.

meta:
  source: "https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/journal-article/publisher-deals"
  curated_date: "2026-08-06"
  page_last_amended: "2026-01-12"      # stated on the Bodleian deals page
  contact: "oapayments@bodleian.ox.ac.uk"

# The Bodleian page states these under "Criteria" as conditions on ANY deal.
# merge.py attaches them to every journal covered by a deal, because a
# researcher reading one journal's page has no other way to learn them.
universal_criteria:
  - "You must be the corresponding author of the accepted article."
  - "You must be publishing a journal article — these deals cannot be used for other research outputs."
  - "You must submit using your Oxford email address (@ox.ac.uk) so the publisher can identify you as Oxford-affiliated."
  - "You must select a CC BY licence when prompted."
  - "Most deals do not cover extras such as page or colour charges."

entries:
  # ---- caveats on JCT-covered agreements -------------------------------
  # capacity_limited is read by merge.py, not just displayed: an agreement with
  # a finite annual allowance cannot support an unqualified "£0", because
  # whether the allowance is still open is a fact nobody here can check. The
  # prose caveat below says the same thing, but prose cannot constrain the
  # headline figure — the flag can.
  - kind: caveat
    match_esac_prefix: "aip"
    publisher_label: "American Institute of Physics"
    capacity_limited: true
    caveats:
      - "Covers an agreed number of articles per year in hybrid titles; the allowance can run out before year end."
      - "AIP's fully open access journals are excluded."

  - kind: caveat
    match_esac_prefix: "bmj"
    publisher_label: "BMJ"
    caveats:
      - "Only covers eligible FUNDED original research articles in BMJ's Standard Collection of subscription journals."
      - "Eligible funders: UKRI, Wellcome Trust, British Heart Foundation, Blood Cancer UK, Cancer Research UK, Parkinson's UK, Versus Arthritis."
    funders_only: ["UKRI", "Wellcome Trust", "British Heart Foundation",
                   "Blood Cancer UK", "Cancer Research UK", "Parkinson's UK",
                   "Versus Arthritis"]

  - kind: caveat
    match_esac_prefix: "els"
    publisher_label: "Elsevier"
    caveats:
      - "Covers most hybrid journals (see participating list); 15% discount on Elsevier fully gold OA journals instead."
    also_discount:
      pct: 15
      applies_to: "Elsevier fully gold open access journals"
      match_publisher_regex: "(?i)^Elsevier"
    source_extra: "https://agreements.journals.elsevier.com/jisc"

  - kind: caveat
    match_esac_prefix: "sage"
    publisher_label: "SAGE"
    caveats:
      - "Most hybrid (SAGE Choice) journals covered; 20% discount on SAGE fully gold OA journals instead."
    also_discount:
      pct: 20
      applies_to: "SAGE fully gold open access journals"
      match_publisher_regex: "(?i)^SAGE"
    source_extra: "https://uk.sagepub.com/en-gb/eur/uk-jisc-agreement"

  - kind: caveat
    match_esac_prefix: "sn"
    publisher_label: "Springer Nature"
    caveats:
      - "Most hybrid and Palgrave journals covered; 15% discount on fully gold OA journals instead."
    also_discount:
      pct: 15
      applies_to: "Springer Nature fully gold open access journals"
      match_publisher_regex: "(?i)^(Springer|Nature Portfolio|Palgrave|BioMed Central|BMC)"

  - kind: caveat
    match_esac_prefix: "rsc"
    publisher_label: "Royal Society of Chemistry"
    capacity_limited: true
    caveats:
      - "Hybrid (subscription) journals covered, up to an annual cap."
      - "15% discount applies to articles above the cap, and to RSC's fully open access journals."
    source_extra: "https://www.rsc.org/journals-books-databases/open-access/read-and-publish/"

  - kind: caveat
    match_esac_prefix: "compbio"
    publisher_label: "Company of Biologists"
    caveats:
      - "Covers the three hybrid subscription journals only — Disease Models & Mechanisms and Biology Open are NOT covered."

  - kind: caveat
    match_esac_prefix: "aps"
    publisher_label: "American Physical Society"
    caveats:
      - "Hybrid APS journals only — all original research and review outputs are covered."
      - "APS gold / pure open access journals are NOT included."

  - kind: caveat
    match_esac_prefix: "thie"
    publisher_label: "Thieme"
    caveats:
      - "Selected hybrid journals only; Thieme's pure open access journals are not included."

  - kind: caveat
    match_esac_prefix: "cam"
    publisher_label: "Cambridge University Press"
    caveats:
      - "Covers research, review articles and rapid communications, plus brief and case reports."
      - "Not covered: abstracts, commentaries, book reviews, editorials, letters, corrections, corrigenda, errata, retractions, obituaries and similar non-research types."
    source_extra: "https://www.cambridge.org/core/services/open-access-policies/read-and-publish-agreements"

  - kind: caveat
    match_esac_prefix: "iop"
    publisher_label: "IOP Publishing"
    caveats:
      - "Covers 44 of IOP's hybrid (subscription) journals and selected open access journals — not the full IOP list."

  - kind: caveat
    match_esac_prefix: "biosci"
    publisher_label: "Bioscientifica"
    caveats:
      - "Hybrid journals only. For Bioscientifica's fully open access journals, apply for support via the usual route."

  - kind: caveat
    match_esac_prefix: "cshl"
    publisher_label: "Cold Spring Harbor Laboratory Press"
    caveats:
      - "Hybrid journals only. For fully open access titles, apply for support via the usual route."

  - kind: caveat
    match_esac_prefix: "gsl"
    publisher_label: "Geological Society of London"
    caveats:
      - "Hybrid journals only. For fully open access titles, apply for support via the usual route."

  - kind: caveat
    match_esac_prefix: "lww"
    publisher_label: "Wolters Kluwer Health"
    caveats:
      - "Selected hybrid journals; Wolters Kluwer Law journals are excluded."

  # ---- source conflicts -------------------------------------------------
  # Where the JCT agreement data and the Bodleian page disagree, the site
  # shows BOTH claims and a health warning rather than silently picking one.
  # The computed cost still follows JCT (the machine-readable source), but the
  # user is told the claim is contested and pointed at both sources.
  #
  # Add an entry here whenever a refresh surfaces a disagreement; remove it
  # once the Bodleian confirms which source is right.
  - kind: conflict
    match_esac_prefix: "mdpi"
    publisher_label: "MDPI"
    jct_says: "Covered by an Oxford transformative agreement (mdpi2026jisc), running to 2027-12-31, across 516 journals."
    bodleian_says: "Listed only under 'Other publisher deals' as a 20% discount on APCs — not as a read-and-publish deal."
    note: >-
      Oxford's own page and the Journal Checker Tool disagree about MDPI. The
      Bodleian's discount table was last updated 1 September 2025, before the
      2026 agreement JCT records, so the page may simply be out of date — but
      this has not been confirmed. Check with the open access team before
      relying on either figure.
    source_extra: "https://www.bodleian.ox.ac.uk/open-research/open-access-publishing/journal-article/publisher-deals"

  # ---- discount schemes (not transformative agreements, not in JCT) ----
  - kind: discount
    publisher_label: "MDPI"
    match_publisher_regex: "(?i)^MDPI"
    pct: 20
    caveats:
      - "20% APC discount for Oxford corresponding authors on all accepted articles."
    # Currently unreachable: JCT records a full MDPI agreement (mdpi2026jisc),
    # so every MDPI journal resolves as `covered` and never falls through to
    # this discount. Kept, because the conflict entry above says the two
    # sources disagree — if the Bodleian page turns out to be right, this is
    # the rule that should apply. Remove the flag when the conflict resolves.
    expect_no_match: true

  - kind: discount
    publisher_label: "Frontiers"
    match_publisher_regex: "(?i)^Frontiers"
    pct: 10
    caveats:
      - "10% APC discount; full APC coverage for UKRI, Wellcome, CRUK or BHF funded authors."
    funders_covered_full: ["UKRI", "Wellcome", "Cancer Research UK", "British Heart Foundation"]

  - kind: discount
    publisher_label: "AAAS — Science Advances"
    match_issns: ["2375-2548"]
    pct: 10
    caveats:
      - "10% discount, applied via the author charge section on submission."
    source_extra: "https://www.science.org/journal/sciadv"

  - kind: discount
    publisher_label: "Hogrefe (open access journals)"
    match_publisher_regex: "(?i)^Hogrefe"
    pct: 25
    caveats:
      - "25% discount on Hogrefe fully OA journals; 15 hybrid titles are covered by the APA/Hogrefe deal."

  # ---- diamond / free-to-publish arrangements --------------------------
  - kind: diamond
    publisher_label: "SciPost"
    match_publisher_regex: "(?i)SciPost"
    caveats:
      - "Oxford is a SciPost supporter: publishing is free for authors (diamond OA)."
    source_extra: "https://scipost.org/about"

  - kind: diamond
    publisher_label: "Peer Community Journal"
    match_issns: ["2804-3871"]
    caveats:
      - "Diamond OA — free to publish across multiple fields."
    source_extra: "https://peercommunityjournal.org/page/about/"

  - kind: diamond
    publisher_label: "SCOAP3 (high-energy physics)"
    match_scoap3: true
    caveats:
      - "Articles in participating high-energy physics journals are published OA at no cost to authors via SCOAP3."
    source_extra: "https://scoap3.org/phase2-journals/"
    # SCOAP3 participating journals (phase 3 list; stable, verified on the
    # SCOAP3 site). ISSNs listed explicitly for deterministic matching:
    match_issns: ["1029-8479", "1126-6708", "0370-2693", "0550-3213",
                  "1748-0221", "2470-0010", "2470-0029", "1434-6044",
                  "1434-6052", "2050-3911", "0001-7701", "1361-6382"]

  # The Bodleian page names exactly three WRUP titles. Matching on the
  # publisher name would wrongly cover every other WRUP journal too.
  - kind: diamond
    publisher_label: "White Rose University Press"
    match_issns:
      - "2398-5992"   # The Undergraduate Journal of Politics and International Relations
      - "2513-8243"   # The Journal of African Cultural Heritage Studies
      - "2633-8815"   # Writing Chinese: A Journal of Contemporary Sinophone Literature
    caveats:
      - "Diamond OA — free to publish. The Oxford arrangement covers these three White Rose University Press titles."
    source_extra: "https://universitypress.whiterose.ac.uk/"

  # Matched by ISSN, not publisher: the six KOALA journals have six different
  # publishers (Centre Mersenne, University of Szeged, University of
  # Queensland, TheoretiCS Foundation, …). No publisher is called "KOALA", so
  # a publisher-name match would never fire.
  - kind: diamond
    publisher_label: "KOALA consortium journals (maths/CS)"
    match_issns:
      - "1417-3875"   # Electronic Journal of Qualitative Theory of Differential Equations
      - "2426-8399"   # The SMAI Journal of Computational Mathematics
      - "1860-5974"   # Logical Methods in Computer Science
      - "2202-3518"   # The Australasian Journal of Combinatorics
      - "2751-4838"   # TheoretiCS
      - "2491-6765"   # Épijournal de Géométrie Algébrique (EPIGA)
    caveats:
      - "Six mathematics/computer science journals, free to publish via the KOALA consortium, which Oxford supports."
    source_extra: "https://projects.tib.eu/koala"

  # ---- green / other ----------------------------------------------------
  - kind: green
    publisher_label: "IEEE"
    match_publisher_regex: "(?i)^(IEEE|Institute of Electrical)"
    caveats:
      - "'Read and green' deal: no APC coverage, but accepted manuscripts can be self-archived in ORA with no embargo."

  - kind: green
    publisher_label: "Edinburgh University Press"
    match_publisher_regex: "(?i)^Edinburgh University Press"
    caveats:
      - "Green OA: accepted manuscripts can be deposited in ORA with no embargo."
    source_extra: "https://www.euppublishing.com/customer-services/authors/open-access-archiving"

  - kind: note
    publisher_label: "PNAS"
    match_issns: ["0027-8424", "1091-6490"]
    caveats:
      - "PNAS is not part of a Jisc agreement. UKRI-funded authors can request a waiver: pnaswaiverrequests@nas.edu."
