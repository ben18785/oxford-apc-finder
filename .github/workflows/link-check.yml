name: Link check

# Every source link the site shows must actually resolve — a dead "learn more"
# link is a data error, not a cosmetic one. Runs against the freshly built
# site, so it checks the URLs users will really click.
on:
  schedule:
    - cron: '43 6 * * 2'          # Tuesdays, the day after the data refresh
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'data/curated/**'
      - 'config.yaml'

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # Build from the committed dataset rather than re-fetching: this job is
      # about link health, and a source outage shouldn't make it fail.
      - name: Build the site from existing data
        run: python pipeline/build_site.py

      - name: Extract every URL the site would show
        run: python pipeline/collect_links.py --out links.txt

      - name: Check the links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200,206,301,302,303,307,308,401,403,429
            --exclude-mail
            links.txt
          output: lychee-report.md
          fail: false

      - uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md

      # One rolling issue rather than a new one each week.
      - name: Ensure the label exists
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create broken-links --color D93F0B --description "Link checker found a dead URL" --force

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found in the published data
          content-filepath: lychee-report.md
          labels: broken-links

      - name: Fail the PR check on broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          cat lychee-report.md
          exit 1
