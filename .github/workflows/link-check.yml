name: Link check

# Every source link the site shows must actually resolve — a dead "learn more"
# link is a data error, not a cosmetic one.
#
# Two modes. The weekly run checks the links the live site serves, taken from
# the last successful refresh. A pull request checks only the links it adds
# itself: the live data's links come from the refresh and no PR can change
# them, so checking those there failed every PR for rot unrelated to the change.
#
# The weekly run keeps two kinds of link apart. The site's own (the Bodleian
# and JCT pages, publisher-deal pages in the curated overlay, API endpoints)
# are this project's to fix: any dead one goes in one rolling issue. Journal
# homepages come from OpenAlex and DOAJ metadata and cannot be fixed here;
# 4% of them were dead on the first real run, and that list of 270 hid the one
# publisher-deal link that had moved. They are counted in the run summary and
# kept as a downloadable report, and never open an issue.
on:
  schedule:
    - cron: '43 6 * * 2'          # Tuesdays, the day after the data refresh
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'data/curated/**'
      - 'config.yaml'
      - '.github/workflows/link-check.yml'
      - '.github/scripts/added_links.py'

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's added links come from its diff against the base branch, so
          # it needs the history. '0' is quoted on purpose: a bare 0 is falsy
          # in Actions expressions, so the unquoted form always gave a shallow clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # The dataset isn't committed, so take the URL list produced by the last
      # successful refresh. That also means this job checks exactly the links
      # the live site is currently serving, and never re-fetches the sources.
      - name: Fetch the link list from the last successful refresh
        id: links
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow=refresh-and-deploy.yml --status=success \
                     --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful refresh run yet — nothing to check."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$run_id" --name links --dir .
          echo "found=true" >> "$GITHUB_OUTPUT"
          # A refresh from before the two kinds were told apart published one
          # list. Check all of it as the site's own, as this job used to,
          # rather than let an unsorted list go unreported.
          if [ -f links-own.txt ]; then
            mv links-own.txt own.txt
            grep -vxFf own.txt links.txt > journals.txt || true
          else
            mv links.txt own.txt
            : > journals.txt
          fi
          wc -l own.txt journals.txt
          [ -s journals.txt ] && echo "journals=true" >> "$GITHUB_OUTPUT" || true

      - name: List the links this pull request adds
        id: pr_links
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/added_links.py "origin/$BASE" > own.txt
          if [ -s own.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "This PR adds $(wc -l < own.txt) link(s):"; cat own.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "This PR adds no links — nothing to check."
          fi

      # No --exclude-mail: lychee dropped the flag (mail addresses are skipped
      # by default now) and exits on an unknown argument before checking
      # anything. With `fail: false` that was silent — every run "found dead
      # links" and filed an issue whose report was empty.
      #
      # The question is whether a reader's browser would get the page, so the
      # checker names itself as a browser and a refusal is not counted as dead:
      # 401, 403 and 429 are sites turning a robot away, and so in practice are
      # 405 and 418 (IEEE Xplore answers "I'm a teapot" to anything automated).
      - name: Check the site's own links
        id: lychee
        if: steps.links.outputs.found == 'true' || steps.pr_links.outputs.found == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --user-agent "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
            --accept 200,206,301,302,303,307,308,401,403,405,418,429
            own.txt
          output: lychee-report.md
          fail: false

      - name: Check this week's sample of journal links
        id: journals
        if: steps.links.outputs.journals == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --user-agent "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
            --accept 200,206,301,302,303,307,308,401,403,405,418,429
            journals.txt
          output: journal-links-report.md
          fail: false

      # Counted, not reported: see the note at the top of this file.
      - name: Summarise the journal links
        if: steps.links.outputs.journals == 'true'
        run: |
          {
            echo "## Journal links (this week's sample)"
            echo
            echo "From OpenAlex and DOAJ metadata, so not fixable in this repository."
            echo "The full list is in the \`lychee-report\` artifact."
            echo
            # The report's summary table, without its per-link list.
            sed -n '/^| Status/,/^$/p' journal-links-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.links.outputs.found == 'true' || steps.pr_links.outputs.found == 'true'
        with:
          name: lychee-report
          path: |
            lychee-report.md
            journal-links-report.md

      - name: Ensure the label exists
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create broken-links --color D93F0B --description "Link checker found a dead URL" --force

      # One rolling issue rather than a new one each week: an open one is
      # rewritten with this week's report.
      - name: Find the open issue, if there is one
        id: issue
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "number=$(gh issue list --label broken-links --state open --limit 1 \
                           --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links among the site's own sources
          content-filepath: lychee-report.md
          labels: broken-links
          issue-number: ${{ steps.issue.outputs.number }}

      - name: Fail the PR check on a broken link it adds
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          cat lychee-report.md
          exit 1
