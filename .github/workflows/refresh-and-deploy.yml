name: Refresh data and deploy

# Weekly refresh. To go daily, change the cron to '17 4 * * *' — the pipeline
# is well inside the free tiers of every source it touches.
on:
  schedule:
    - cron: '17 4 * * 1'          # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      skip_oracle:
        description: 'Skip the live JCT oracle cross-check (use only to unblock a known-good build)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:                        # site/pipeline changes redeploy from existing data
      - 'site/**'
      - 'pipeline/**'
      - 'config.yaml'
      - 'data/curated/**'
      - '.github/workflows/refresh-and-deploy.yml'

permissions:
  contents: write                 # commit refreshed baselines back to main
  pages: write
  id-token: write
  issues: write                   # open the Bodleian needs-review issue

# Never let two refreshes race on the Pages deployment or on the baseline
# commit. cancel-in-progress is deliberately TRUE: GitHub keeps only one
# pending run per concurrency group, so with `false` a run stuck waiting on the
# Pages environment (as happened during an Actions outage) holds the group
# forever and silently cancels every run queued behind it. A refresh is
# idempotent and rebuilds from source each time, so superseding an in-flight
# one costs nothing and cannot deadlock.
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site's report box links to issues/new?labels=user-report. GitHub
      # drops labels that don't exist, so create them once, idempotently.
      - name: Ensure issue labels exist
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create user-report  --color 0E8A16 --description "Reported from the site's report box" --force
          gh label create data-error   --color D93F0B --description "Something on the site is wrong" --force
          gh label create needs-review --color FBCA04 --description "A watched source changed" --force
          gh label create broken-links --color D93F0B --description "Link checker found a dead URL" --force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # --- Stage 2 runs on its own because a changed Bodleian page is a
      # "human, come and look" signal, not a build failure. Exit 3 means the
      # page moved; the curated overlay may need a matching edit.
      - name: Watch the Bodleian deals page
        id: bodleian
        continue-on-error: true
        run: python pipeline/watch_bodleian.py

      - name: Open a needs-review issue if the Bodleian page changed
        if: steps.bodleian.outcome == 'failure' && hashFiles('data/cache/bodleian_diff.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The Bodleian publisher-deals page changed since the last refresh."
            echo
            echo "Check whether \`data/curated/oxford_overrides.yaml\` needs a matching edit,"
            echo "then close this issue. The stored snapshot has already been updated to match"
            echo "the live page, so this will not fire again for the same change."
            echo
            echo '<details><summary>Text diff</summary>'
            echo
            echo '```diff'
            head -c 50000 data/cache/bodleian_diff.txt
            echo
            echo '```'
            echo '</details>'
          } > /tmp/issue-body.md
          gh issue create \
            --title "Bodleian deals page changed — review oxford_overrides.yaml ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/issue-body.md \
            --label needs-review

      # --- Stages 1, 3, 4, 5, 6. Any failure here aborts before deploy, so the
      # live site keeps serving the last dataset that passed validation.
      - name: Run the pipeline
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          APC_SKIP_ORACLE: ${{ inputs.skip_oracle && '1' || '' }}
        run: python pipeline/run_all.py

      - name: Commit refreshed baselines
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/out/last_counts.json data/curated/bodleian_snapshot.txt \
                     data/cache/manifest.json data/state/journal_state.tsv \
                     CHANGELOG-data.md
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(data): refresh baselines [skip ci]"
            git push
          fi

      # The link checker runs on its own schedule and has no dataset of its
      # own (data/out is not committed), so publish the URL list here.
      - name: Collect the URLs the site can show
        run: python pipeline/collect_links.py --out links.txt

      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: links.txt
          retention-days: 30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # A scheduled job that fails quietly is how a data site rots: the last
      # good build keeps serving, looking healthy, for weeks. Say so loudly.
      # (The site also shows a staleness banner once the data passes
      # validation.max_dataset_age_days, so readers are told independently.)
      - name: Announce a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create refresh-failed --color B60205 \
            --description "A scheduled data refresh did not complete" --force
          existing=$(gh issue list --label refresh-failed --state open \
                       --json number --jq '.[0].number')
          body=$(printf 'The data refresh failed, so the site is still serving the previous dataset.\n\nIt will keep serving stale data until a refresh succeeds. The site shows readers a staleness banner once the data is older than the configured limit.\n\nRun: %s\n\nCommon causes, in rough order of likelihood:\n- an upstream source changed shape (check the Tests workflow contract job)\n- validation refused the build (a source came back truncated, or coverage dropped sharply)\n- the OPENALEX_API_KEY secret is missing or out of quota\n' \
                   "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Data refresh failed" --body "$body" \
              --label refresh-failed
          fi

      # A refresh that succeeds closes any standing failure issue, so the
      # tracker reflects the current state rather than accumulating noise.
      - name: Clear the failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label refresh-failed --state open \
                       --json number --jq '.[].number'); do
            gh issue close "$n" --comment "A later refresh completed successfully."
          done

      # Keep the built dataset around for a fortnight so a bad week can be
      # diagnosed (or rolled back) without re-running every fetch.
      - name: Archive the dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ github.run_number }}
          path: |
            data/out/
            data/cache/manifest.json
          retention-days: 14
